# BHOST OS : menu de la clé USB.
# Sans BHOST OS sur un disque : l'installation démarre tout de suite.
# Avec BHOST OS déjà installé (clé oubliée dans la machine) : on démarre la machine installée.
insmod part_gpt
insmod part_msdos
insmod ext2
set timeout_style=hidden
set timeout=0
set default=installer

if search --no-floppy --file --set=installe /boot/bhost-installe; then
	set default=machine
	set timeout_style=menu
	set timeout=5
	menuentry "BHOST OS" --id machine {
		set root=$installe
		configfile /boot/grub/grub.cfg
	}
fi

menuentry "Installer BHOST OS (efface le disque choisi)" --id installer {
	linux /boot/vmlinuz boot=bhost quiet loglevel=3 consoleblank=0 video=1024x768 fsck.mode=skip
	initrd /boot/initrd
}
