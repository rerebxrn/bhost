[package]
name = "bhost-relais"
version = "0.1.0"
description = "Le relais de BHOST : les amis rejoignent un serveur Minecraft même quand la box bloque."
authors = ["Thomas"]
edition = "2024"

[lib]
name = "bhost_relais"
path = "src/lib.rs"

[[bin]]
name = "bhost-relais"
path = "src/main.rs"

[dependencies]
# Beaucoup de connexions à la fois, sans un fil par connexion.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
# Les clés de BHOST : chaque nom appartient à une clé (signature ed25519).
ed25519-dalek = "2.1"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Plus de fichiers ouverts que la limite par défaut du système (1024) : deux par joueur relayé.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
